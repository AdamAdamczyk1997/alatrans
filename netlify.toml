[build]
  command = "node scripts/netlify-release-gate.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[context.deploy-preview.environment]
  PREVIEW_NOINDEX = "true"

[context.branch-deploy.environment]
  PREVIEW_NOINDEX = "true"

